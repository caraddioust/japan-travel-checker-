<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff5722">
    <title>47都道府県制覇チェッカー</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; line-height: 1.6; }
        h1 { text-align: center; margin-bottom: 10px; }
        
        /* カウンター表示 */
        .stats {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        .stats b { color: #ff5722; font-size: 1.3rem; }

        .pref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            list-style: none;
            padding: 0;
            margin-bottom: 30px;
        }

        .pref {
            background: white;
            border: 2px solid #ddd;
            padding: 10px 18px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            user-select: none;
            min-height: 44px; 
        }

        /* 色の状態 */
        .pref.visited { background-color: #ff9800 !important; color: white; border-color: #f57c00; }
        .pref.completed { background: linear-gradient(135deg, #ffd700, #ffb700) !important; color: #333; border-color: #d4af37; font-weight: bold; }
        .pref.passing { border: 2px solid #81d4fa; background-color: #e1f5fe; }

        .usage-hint {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.7); color: white;
            padding: 8px 15px; border-radius: 20px; font-size: 0.8rem;
            z-index: 1000; pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>🗾 都道府県 訪問記録</h1>

<div class="stats">
    <div style="margin-bottom: 10px;">
        <button id="view-current" onclick="switchView('current')" style="font-weight:bold;">現行自治体</button>
        <button id="view-old" onclick="switchView('old')">旧市町村</button>
    </div>

    都道府県：<b><span id="pref-count">0</span></b> / 47<br>
    <small>( 🚗通過:<span id="pref-pass">0</span> | 🧡訪問:<span id="pref-visit">0</span> | 💜宿泊:<span id="pref-stay">0</span> )</small>
    <br>

    <span id="stat-label">市町村</span>：<b><span id="city-count">0</span></b> / <span id="city-total">0</span><br>
    <small>( 🚗通過:<span id="city-pass">0</span> | 🧡訪問:<span id="city-visit">0</span> | 💜宿泊:<span id="city-stay">0</span> )</small>
</div>

    <div id="regions-container"></div>

    <div class="usage-hint">都道府県名をクリックで市町村詳細</div>

<script>
    const prefectures = [
        {name:"北海道",region:"hokkaido",id:"hokkaido",total:179,oldTotal:212},
        {name:"青森県",region:"tohoku",id:"aomori",total:40,oldTotal:67},
        {name:"岩手県",region:"tohoku",id:"iwate",total:33,oldTotal:59},
        {name:"宮城県",region:"tohoku",id:"miyagi",total:35,oldTotal:71},
        {name:"秋田県",region:"tohoku",id:"akita",total:25,oldTotal:69},
        {name:"山形県",region:"tohoku",id:"yamagata",total:35,oldTotal:44},
        {name:"福島県",region:"tohoku",id:"fukushima",total:59,oldTotal:90},
        {name:"茨城県",region:"kanto",id:"ibaraki",total:44,oldTotal:85},
        {name:"栃木県",region:"kanto",id:"tochigi",total:25,oldTotal:49},
        {name:"群馬県",region:"kanto",id:"gunma",total:35,oldTotal:70},
        {name:"埼玉県",region:"kanto",id:"saitama",total:63,oldTotal:92},
        {name:"千葉県",region:"kanto",id:"chiba",total:54,oldTotal:80},
        {name:"東京都",region:"kanto",id:"tokyo",total:62,oldTotal:40},
        {name:"神奈川県",region:"kanto",id:"kanagawa",total:33,oldTotal:37},
        {name:"新潟県",region:"chubu",id:"niigata",total:30,oldTotal:112},
        {name:"富山県",region:"chubu",id:"toyama",total:15,oldTotal:35},
        {name:"石川県",region:"chubu",id:"ishikawa",total:19,oldTotal:41},
        {name:"福井県",region:"chubu",id:"fukui",total:17,oldTotal:35},
        {name:"山梨県",region:"chubu",id:"yamanashi",total:27,oldTotal:64},
        {name:"長野県",region:"chubu",id:"nagano",total:77,oldTotal:120},
        {name:"岐阜県",region:"chubu",id:"gifu",total:42,oldTotal:99},
        {name:"静岡県",region:"chubu",id:"shizuoka",total:35,oldTotal:74},
        {name:"愛知県",region:"chubu",id:"aichi",total:54,oldTotal:88},
        {name:"三重県",region:"kinki",id:"mie",total:29,oldTotal:69},
        {name:"滋賀県",region:"kinki",id:"shiga",total:19,oldTotal:50},
        {name:"京都府",region:"kinki",id:"kyoto",total:26,oldTotal:44},
        {name:"大阪府",region:"kinki",id:"osaka",total:43,oldTotal:44},
        {name:"兵庫県",region:"kinki",id:"hyogo",total:41,oldTotal:91},
        {name:"奈良県",region:"kinki",id:"nara",total:39,oldTotal:47},
        {name:"和歌山県",region:"kinki",id:"wakayama",total:30,oldTotal:50},
        {name:"鳥取県",region:"chugoku",id:"tottori",total:19,oldTotal:39},
        {name:"島根県",region:"chugoku",id:"shimane",total:19,oldTotal:59},
        {name:"岡山県",region:"chugoku",id:"okayama",total:27,oldTotal:78},
        {name:"広島県",region:"chugoku",id:"hiroshima",total:23,oldTotal:86},
        {name:"山口県",region:"chugoku",id:"yamaguchi",total:19,oldTotal:56},
        {name:"徳島県",region:"shikoku",id:"tokushima",total:24,oldTotal:50},
        {name:"香川県",region:"shikoku",id:"kagawa",total:17,oldTotal:43},
        {name:"愛媛県",region:"shikoku",id:"ehime",total:20,oldTotal:70},
        {name:"高知県",region:"shikoku",id:"kochi",total:34,oldTotal:53},
        {name:"福岡県",region:"kyushu",id:"fukuoka",total:60,oldTotal:97},
        {name:"佐賀県",region:"kyushu",id:"saga",total:20,oldTotal:49},
        {name:"長崎県",region:"kyushu",id:"nagasaki",total:21,oldTotal:79},
        {name:"熊本県",region:"kyushu",id:"kumamoto",total:45,oldTotal:94},
        {name:"大分県",region:"kyushu",id:"oita",total:18,oldTotal:58},
        {name:"宮崎県",region:"kyushu",id:"miyazaki",total:26,oldTotal:44},
        {name:"鹿児島県",region:"kyushu",id:"kagoshima",total:43,oldTotal:96},
        {name:"沖縄県",region:"kyushu",id:"okinawa",total:41,oldTotal:53}
    ];

    const regionNames = {
        hokkaido: "北海道", tohoku: "東北地方", kanto: "関東地方", chubu: "中部地方",
        kinki: "近畿地方", chugoku: "中国地方", shikoku: "四国地方", kyushu: "九州・沖縄地方"
    };

    // 表示モードの管理（初期値は現行）
let currentViewMode = 'current';

function switchView(mode) {
    currentViewMode = mode;
    // ボタンの見た目を更新
    document.getElementById('view-current').style.fontWeight = (mode === 'current' ? 'bold' : 'normal');
    document.getElementById('view-old').style.fontWeight = (mode === 'old' ? 'bold' : 'normal');
    document.getElementById('stat-label').textContent = (mode === 'current' ? '市町村' : '旧市町村');
    
    renderPage(); // 再描画
}

function renderPage() {
    const container = document.getElementById('regions-container');
    container.innerHTML = "";
    let currentRegion = "";
    let currentUl = null;

    // --- 【重要】ここで変数をゼロリセットして定義 ---
    let cityVisited = 0, cityPass = 0, cityVisit = 0, cityStay = 0;
    let prefVisited = 0, prefPass = 0, prefVisit = 0, prefStay = 0;

    prefectures.forEach(item => {
        // 地方見出しの作成
        if (currentRegion !== item.region) {
            currentRegion = item.region;
            const h2 = document.createElement('h2');
            h2.textContent = regionNames[item.region];
            container.appendChild(h2);
            currentUl = document.createElement('ul');
            currentUl.className = 'pref-grid';
            container.appendChild(currentUl);
        }

        // データの読み込み（モードによってキーを変える）
        const key = (currentViewMode === 'current') ? `status_${item.id}` : `status_${item.id}_old`;
        const statusMap = JSON.parse(localStorage.getItem(key)) || {};
        const statuses = Object.values(statusMap);

        // --- 市町村の集計 ---
        // 'none' 以外の数を数える
        const prefCityCount = statuses.filter(s => s !== 'none').length;
        
        // 全体統計に加算（ここが 0 のままだと増えません）
        cityVisited += prefCityCount;
        cityPass += statuses.filter(s => s === 'pass').length;
        cityVisit += statuses.filter(s => s === 'visit').length;
        cityStay += statuses.filter(s => s === 'stay').length;

        // --- 都道府県の集計 ---
        if (prefCityCount > 0) {
            prefVisited++;
            if (statuses.includes('stay')) prefStay++;
            else if (statuses.includes('visit')) prefVisit++;
            else if (statuses.includes('pass')) prefPass++;
        }

        // --- リスト表示の作成 ---
        const totalDisplay = (currentViewMode === 'current') ? item.total : (item.oldTotal || 0);
        const li = document.createElement('li');
        li.className = 'pref';
        li.textContent = `${item.name} (${prefCityCount}/${totalDisplay})`;

        // 色付け
        if (statuses.includes('stay')) li.classList.add('completed');
        else if (statuses.includes('visit')) li.classList.add('visited');
        else if (statuses.includes('pass')) li.classList.add('passing');

        // クリックイベント
        li.onclick = () => {
            window.location.href = `city.html?pref=${item.id}&name=${encodeURIComponent(item.name)}&type=${currentViewMode}`;
        };

        currentUl.appendChild(li);
    });

    // --- 【重要】ループが終わった後に画面に反映 ---
    
    // 都道府県の反映
    document.getElementById('pref-count').textContent = prefVisited;
    document.getElementById('pref-pass').textContent = prefPass;
    document.getElementById('pref-visit').textContent = prefVisit;
    document.getElementById('pref-stay').textContent = prefStay;

    // 市町村の反映
    document.getElementById('city-count').textContent = cityVisited;
    document.getElementById('city-pass').textContent = cityPass;
    document.getElementById('city-visit').textContent = cityVisit;
    document.getElementById('city-stay').textContent = cityStay;

    // 全体の分母
    const overallTotal = prefectures.reduce((sum, p) => {
        return sum + (currentViewMode === 'current' ? p.total : (p.oldTotal || 0));
    }, 0);
    document.getElementById('city-total').textContent = overallTotal;
}
    // バックアップ機能
    window.exportData = function() {
        const allData = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('status_')) {
                allData[key] = localStorage.getItem(key);
            }
        }
        document.getElementById('backupText').value = JSON.stringify(allData);
        alert("データを書き出しました！");
    };

    window.importData = function() {
        const jsonText = document.getElementById('backupText').value;
        try {
            const data = JSON.parse(jsonText);
            Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
            alert("復元完了！");
            renderPage();
        } catch (e) {
            alert("エラー：正しいデータを貼り付けてください");
        }
    };

    // 初期実行
    renderPage();
</script>

<hr style="margin-top: 50px;">
<div class="backup-section" style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 50px;">
    <h3>💾 バックアップ</h3>
    <textarea id="backupText" style="width: 100%; height: 60px;"></textarea>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button onclick="exportData()" style="flex: 1; padding: 10px; background: #4caf50; color: white; border: none; border-radius: 5px;">書き出し</button>
        <button onclick="importData()" style="flex: 1; padding: 10px; background: #2196f3; color: white; border: none; border-radius: 5px;">復元</button>
    </div>
</div>
</body>
</html>
