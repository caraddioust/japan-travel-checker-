<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff5722">
    <title>47都道府県制覇チェッカー</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; line-height: 1.6; }
        h1 { text-align: center; margin-bottom: 10px; }
        
        /* カウンター表示 */
        .stats {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        .stats b { color: #ff5722; font-size: 1.3rem; }

        .pref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            list-style: none;
            padding: 0;
            margin-bottom: 30px;
        }

        .pref {
            background: white;
            border: 2px solid #ddd;
            padding: 15px 5px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            user-select: none;
        }

        /* 色の状態 */
        .pref.visited { background-color: #ff9800 !important; color: white; border-color: #f57c00; }
        .pref.completed { background: linear-gradient(135deg, #ffd700, #ffb700) !important; color: #333; border-color: #d4af37; font-weight: bold; }
        .pref.passing { border: 2px solid #81d4fa; background-color: #e1f5fe; }

        .usage-hint {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.7); color: white;
            padding: 8px 15px; border-radius: 20px; font-size: 0.8rem;
            z-index: 1000; pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>🗾 都道府県 訪問記録</h1>

<div class="stats">
    <!-- 都道府県の統計 -->
    都道府県：<b><span id="pref-count">0</span></b> / 47<br>
    <small>
        ( 
        🚗通過: <span id="pref-pass">0</span> | 
        🧡訪問: <span id="pref-visit">0</span> | 
        💜宿泊: <span id="pref-stay">0</span> 
        )
    </small>
    <br>

    <!-- 市町村の統計 -->
    市町村：<b><span id="city-count">0</span></b> / <span id="city-total">0</span><br>
    <small>
        ( 
        🚗通過: <span id="city-pass">0</span> | 
        🧡訪問: <span id="city-visit">0</span> | 
        💜宿泊: <span id="city-stay">0</span> 
        )
    </small>
</div>

    <div id="regions-container"></div>

    <div class="usage-hint">都道府県名をクリックで市町村詳細</div>

<script>
    const prefectures = [
        {name:"北海道",region:"hokkaido",id:"hokkaido",total:179},
        {name:"青森県",region:"tohoku",id:"aomori",total:40},
        {name:"岩手県",region:"tohoku",id:"iwate",total:33},
        {name:"宮城県",region:"tohoku",id:"miyagi",total:35},
        {name:"秋田県",region:"tohoku",id:"akita",total:25},
        {name:"山形県",region:"tohoku",id:"yamagata",total:35},
        {name:"福島県",region:"tohoku",id:"fukushima",total:59},
        {name:"茨城県",region:"kanto",id:"ibaraki",total:44},
        {name:"栃木県",region:"kanto",id:"tochigi",total:25},
        {name:"群馬県",region:"kanto",id:"gunma",total:35},
        {name:"埼玉県",region:"kanto",id:"saitama",total:63},
        {name:"千葉県",region:"kanto",id:"chiba",total:54},
        {name:"東京都",region:"kanto",id:"tokyo",total:62},
        {name:"神奈川県",region:"kanto",id:"kanagawa",total:33},
        {name:"新潟県",region:"chubu",id:"niigata",total:30},
        {name:"富山県",region:"chubu",id:"toyama",total:15},
        {name:"石川県",region:"chubu",id:"ishikawa",total:19},
        {name:"福井県",region:"chubu",id:"fukui",total:17},
        {name:"山梨県",region:"chubu",id:"yamanashi",total:27},
        {name:"長野県",region:"chubu",id:"nagano",total:77},
        {name:"岐阜県",region:"chubu",id:"gifu",total:42},
        {name:"静岡県",region:"chubu",id:"shizuoka",total:35},
        {name:"愛知県",region:"chubu",id:"aichi",total:54},
        {name:"三重県",region:"kinki",id:"mie",total:29},
        {name:"滋賀県",region:"kinki",id:"shiga",total:19},
        {name:"京都府",region:"kinki",id:"kyoto",total:26},
        {name:"大阪府",region:"kinki",id:"osaka",total:43},
        {name:"兵庫県",region:"kinki",id:"hyogo",total:41},
        {name:"奈良県",region:"kinki",id:"nara",total:39},
        {name:"和歌山県",region:"kinki",id:"wakayama",total:30},
        {name:"鳥取県",region:"chugoku",id:"tottori",total:19},
        {name:"島根県",region:"chugoku",id:"shimane",total:19},
        {name:"岡山県",region:"chugoku",id:"okayama",total:27},
        {name:"広島県",region:"chugoku",id:"hiroshima",total:23},
        {name:"山口県",region:"chugoku",id:"yamaguchi",total:19},
        {name:"徳島県",region:"shikoku",id:"tokushima",total:24},
        {name:"香川県",region:"shikoku",id:"kagawa",total:17},
        {name:"愛媛県",region:"shikoku",id:"ehime",total:20},
        {name:"高知県",region:"shikoku",id:"kochi",total:34},
        {name:"福岡県",region:"kyushu",id:"fukuoka",total:60},
        {name:"佐賀県",region:"kyushu",id:"saga",total:20},
        {name:"長崎県",region:"kyushu",id:"nagasaki",total:21},
        {name:"熊本県",region:"kyushu",id:"kumamoto",total:45},
        {name:"大分県",region:"kyushu",id:"oita",total:18},
        {name:"宮崎県",region:"kyushu",id:"miyazaki",total:26},
        {name:"鹿児島県",region:"kyushu",id:"kagoshima",total:43},
        {name:"沖縄県",region:"kyushu",id:"okinawa",total:41}
    ];

    const regionNames = {
        hokkaido: "北海道", tohoku: "東北地方", kanto: "関東地方", chubu: "中部地方",
        kinki: "近畿地方", chugoku: "中国地方", shikoku: "四国地方", kyushu: "九州・沖縄地方"
    };

    function renderPage() {
        const container = document.getElementById('regions-container');
        container.innerHTML = "";
        let currentRegion = "";
        let currentUl = null;

        let totalCityCount = 0;
        let cityPass = 0, cityVisit = 0, cityStay = 0;

        let totalPrefCount = 0;
        let prefPass = 0, prefVisit = 0, prefStay = 0;
        
        const overallCityTotal = prefectures.reduce((sum, p) => sum + p.total, 0);

        prefectures.forEach(item => {
            // 地方ごとのセクション作成
            if (currentRegion !== item.region) {
                currentRegion = item.region;
                const h2 = document.createElement('h2');
                h2.textContent = regionNames[item.region];
                container.appendChild(h2);
                currentUl = document.createElement('ul');
                currentUl.className = 'pref-grid';
                container.appendChild(currentUl);
            }

            // データ読み込み
            const key = `status_${item.id}`;
            const statusMap = JSON.parse(localStorage.getItem(key)) || {};
            const statuses = Object.values(statusMap);
            
            // カウント計算 ('none' 以外をカウント)
            const prefVisitedCount = statuses.filter(s => s !== 'none').length;
            totalCityCount += prefVisitedCount;
            cityPass += statuses.filter(s => s === 'pass').length;
            cityVisit += statuses.filter(s => s === 'visit').length;
            cityStay += statuses.filter(s => s === 'stay').length;
            
            //--- 都道府県の集計 ---
            if (prefVisitedCount > 0){
            totalPrefCount++;
            // その県の中で一番強い状態を、その県の状態とする
                if (statuses.includes('stay')) {
                    prefStay++;
                } else if (statuses.includes('visit')) {
                    prefVisit++;
                } else if (statuses.includes('pass')) {
                    prefPass++;
                }
            }
        

            // リスト作成
            const li = document.createElement('li');
            li.className = 'pref';
            li.textContent = `${item.name} (${prefVisitedCount}/${item.total})`;

            // クラス判定
            if (statuses.includes('stay')) {
                li.classList.add('completed');
            } else if (statuses.includes('visit')) {
                li.classList.add('visited');
            } else if (statuses.includes('pass')) {
                li.classList.add('passing');
            }

            // --- クリック処理（シングルクリックで即移動、ダブルクリック構造も保持） ---
            let clickCount = 0;
            li.onclick = function() {
                clickCount++;

                if (clickCount === 1) {
                    // --- 1回目のクリック（シングルクリック） ---
                    setTimeout(() => {
                        if (clickCount === 1) {
                            // シングルクリック確定時の処理：ページ移動
                            window.location.href = `city.html?pref=${item.id}&name=${encodeURIComponent(item.name)}`;
                        } else {
                            // ダブルクリック確定時の処理：今は空ですが、将来の拡張用に残せます
                            console.log("ダブルクリックされました（将来の拡張用）");
                            // 例：詳細情報をポップアップで出す、など
                        }
                        clickCount = 0; // カウントをリセット
                    }, 250); // 0.25秒以内に2回目が来なければシングルとみなす
                }
            };

            currentUl.appendChild(li);
        });

        // --- 画面への反映 ---
    // 都道府県
    document.getElementById('pref-count').textContent = totalPrefCount;
    document.getElementById('pref-pass').textContent = prefPass;
    document.getElementById('pref-visit').textContent = prefVisit;
    document.getElementById('pref-stay').textContent = prefStay;

    // 市町村
    document.getElementById('city-count').textContent = totalCityCount;
    document.getElementById('city-total').textContent = overallCityTotal;
    document.getElementById('city-pass').textContent = cityPass;
    document.getElementById('city-visit').textContent = cityVisit;
    document.getElementById('city-stay').textContent = cityStay;
}


    // バックアップ機能
    window.exportData = function() {
        const allData = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('status_')) {
                allData[key] = localStorage.getItem(key);
            }
        }
        document.getElementById('backupText').value = JSON.stringify(allData);
        alert("データを書き出しました！");
    };

    window.importData = function() {
        const jsonText = document.getElementById('backupText').value;
        try {
            const data = JSON.parse(jsonText);
            Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
            alert("復元完了！");
            renderPage();
        } catch (e) {
            alert("エラー：正しいデータを貼り付けてください");
        }
    };

    // 初期実行
    renderPage();
</script>

<hr style="margin-top: 50px;">
<div class="backup-section" style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 50px;">
    <h3>💾 バックアップ</h3>
    <textarea id="backupText" style="width: 100%; height: 60px;"></textarea>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button onclick="exportData()" style="flex: 1; padding: 10px; background: #4caf50; color: white; border: none; border-radius: 5px;">書き出し</button>
        <button onclick="importData()" style="flex: 1; padding: 10px; background: #2196f3; color: white; border: none; border-radius: 5px;">復元</button>
    </div>
</div>
</body>
</html>
