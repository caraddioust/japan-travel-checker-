<!DOCTYPE html>
<html lang="ja">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>47都道府県制覇チェッカー</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; }
        h1 { text-align: center; }
        
        /* カウンターの見た目 */
        .counter {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        /* 都道府県リストのレイアウト */
        .pref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            list-style: none;
            padding: 0;
        }

        /* 共通設定 */
        .pref.visited { color: white; }

        /* 地方ごとの色設定（例） */
        .hokkaido.visited { background-color: #448aff; }
        .tohoku.visited   { background-color: #4caf50; }
        .kanto.visited    { background-color: #ff9800; }
        .chubu.visited    { background-color: #ffeb3b; color: #333; }
        .kinki.visited    { background-color: #e91e63; }
        .chugoku.visited  { background-color: #8bc34a; }
        .shikoku.visited  { background-color: #00bcd4; }
        .kyushu.visited   { background-color: #795548; }

        /* 各都道府県ボタンの見た目 */
        .pref {
            background: white;
            border: 2px solid #ddd;
            padding: 15px 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        /* 訪問済みの色（オレンジ） */
        .pref.visited {
            background-color: #ff5722;
            color: white;
            border-color: #e64a19;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .pref.visited.hokkaido { background-color: #448aff; } /* 青 */
        .pref.visited.tohoku   { background-color: #4caf50; } /* 緑 */
        .pref.visited.kanto    { background-color: #ff9800; } /* オレンジ */
        .pref.visited.chubu    { background-color: #fbc02d; color: #333; } /* 黄 */
        .pref.visited.kinki    { background-color: #e91e63; } /* ピンク */
        .pref.visited.chugoku  { background-color: #8bc34a; } /* 黄緑 */
        .pref.visited.shikoku  { background-color: #00bcd4; } /* 水色 */
        .pref.visited.kyushu   { background-color: #795548; } /* 茶色 */

        .pref:hover { border-color: #999; }
    </style>
</head>
<body>

    <h1>🗾 福岡県 訪問記録</h1>
    <a href="i.html" style="text-decoration: none; color: #666;">← 都道府県一覧へ戻る</a>
    <div class="stats">
    制覇数：<span id="count">0</span> / <span id="total">0</span>
    </div>
    <div class="mode-switch" style="margin: 10px 0; text-align: center;">
        <button id="btn-current" onclick="switchMode('current')" style="font-weight: bold;">現行市町村</button>
        <button id="btn-old" onclick="switchMode('old')">合併前（旧市町村）</button>
    </div>
    <div id="regions-container"></div>

<script>
    // 1. URLから情報を取得
    const urlParams = new URLSearchParams(window.location.search);
    const targetPref = urlParams.get('pref') || 'fukuoka'; // 予備で福岡に
    const targetName = urlParams.get('name') || '都道府県';
    const mode = urlParams.get('type') || 'current';

    // 2. 読み込むファイル名と保存キーをここで確定させる
    const fileName = (mode === 'old') ? `${targetPref}_old` : targetPref;
    const finalKey = `visited_${targetPref}_${mode}`; // これをずっと使う

    // 3. タイトルとタブ名の設定
    if (targetName) {
        const suffix = (mode === 'old') ? '（旧市町村）' : '';
        const h1 = document.querySelector('h1');
        if (h1) h1.textContent = `🗾 ${targetName} 訪問記録${suffix}`;
        document.title = `${targetName} 訪問記録${suffix}`;
    }

    // 4. データの読み込み
    fetch(`./data/${fileName}.json`)
        .then(response => {
            if (!response.ok) throw new Error("File not found");
            return response.json();
        })
        .then(data => {
            // 読み込みに成功したら画面作成とカウント更新
            renderCityList(data, finalKey);
            updateCounter(data, finalKey);
        })
        .catch(error => {
            console.error("Fetch Error:", error);
            const container = document.getElementById('regions-container');
            if (container) {
                container.innerHTML = `<p style="color:red; text-align:center;">データ（${fileName}.json）が読み込めませんでした。</p>`;
            }
        });

    // 5. 画面を作る関数 (keyを受け取って使う)
    function renderCityList(cities, storageKey) {
        const container = document.getElementById('regions-container');
        if (!container) return;
        container.innerHTML = ""; 

        let visitedList = JSON.parse(localStorage.getItem(storageKey)) || [];
        let currentRegion = "";
        let currentUl = null;
        
        cities.forEach(item => {
            if (currentRegion !== item.region) {
                currentRegion = item.region;
                const h2 = document.createElement('h2');
                h2.textContent = item.region;
                h2.style.borderBottom = "2px solid #ccc";
                h2.style.marginTop = "30px";
                container.appendChild(h2);

                currentUl = document.createElement('ul');
                currentUl.className = 'pref-grid'; 
                container.appendChild(currentUl);
            }

            const li = document.createElement('li');
            li.textContent = item.name;
            li.className = `pref ${item.region}`;
            
            if (visitedList.includes(item.name)) {
                li.classList.add('visited');
            }

            li.onclick = function() {
                this.classList.toggle('visited');
                const cityName = item.name; 

                // 保存リストの更新
                if (this.classList.contains('visited')) {
                    if (!visitedList.includes(cityName)) visitedList.push(cityName);
                } else {
                    visitedList = visitedList.filter(p => p !== cityName);
                }
                
                localStorage.setItem(storageKey, JSON.stringify(visitedList));
                updateCounter(cities, storageKey);
            };
            if (currentUl) currentUl.appendChild(li);
        });
    }

    // 6. カウンター更新関数 (keyを受け取って使う)
    function updateCounter(cities, storageKey) {
        const visitedList = JSON.parse(localStorage.getItem(storageKey)) || [];
        const countEl = document.getElementById('count');
        const totalEl = document.getElementById('total');

        if (countEl) countEl.textContent = visitedList.length;
        if (totalEl) totalEl.textContent = cities.length;
    }

    // 7. モード切り替え関数
    function switchMode(newMode) {
        const url = new URL(window.location.href);
        url.searchParams.set('type', newMode);
        window.location.href = url.href;
    }
</script>
</body>
</html>
